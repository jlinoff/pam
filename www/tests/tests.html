<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAM Unit Tests</title>
  <style>
    body { font-family: monospace; font-size: 14px; margin: 2em; background: #1a1a1a; color: #ccc; }
    h1   { color: #fff; margin-bottom: 0.25em; }
    h2   { color: #aaa; font-size: 1em; margin: 1.5em 0 0.5em; border-bottom: 1px solid #333; padding-bottom: 0.25em; }
    .summary { font-size: 1.1em; margin: 1em 0; padding: 0.5em 1em; border-radius: 4px; }
    .pass    { color: #4caf50; }
    .fail    { color: #f44336; }
    .skip    { color: #888; }
    .summary.all-pass { background: #1b3a1b; border: 1px solid #4caf50; }
    .summary.has-fail { background: #3a1b1b; border: 1px solid #f44336; }
    .test-line { margin: 2px 0; padding-left: 1em; }
    .test-line.fail { background: #2a1a1a; }
    pre  { margin: 0.25em 0 0.25em 2em; color: #f44336; font-size: 0.9em; }
    #x-summary-text { font-weight: bold; }
  </style>
</head>
<body>
  <h1>PAM Unit Tests</h1>
  <div id="x-summary" class="summary">Running...</div>
  <div id="x-results"></div>

<script type="module">

// ---------------------------------------------------------------------------
// Minimal window.prefs stub — must be set before any app module is imported
// ---------------------------------------------------------------------------
window.prefs = {
  // status
  statusMsgDurationMS: 1500,
  logStatusToConsole: false,
  // search
  searchCaseInsensitive: true,
  searchRecordTitles: true,
  searchRecordFieldNames: true,
  searchRecordFieldValues: true,
  hideInactiveRecords: false,
  // password / memorable
  memorablePasswordWordSeparator: '-',
  memorablePasswordMinWordLength: 3,
  memorablePasswordMaxWords: 6,
  memorablePasswordMinWords: 2,
  memorablePasswordMaxTries: 1000,
  memorablePasswordPrefix: '',
  memorablePasswordSuffix: '',
  passwordRangeMinLength: 8,
  passwordRangeMaxLength: 64,
  passwordRangeLengthDefault: 16,
  // file pass cache
  filePassCache: 'session',
  filePass: '',
  // misc
  themeName: 'dark',
  enableRawJSONEdit: false,
  // prefs lock (SEC-006 revert: plaintext, not hashed)
  lockPreferencesPassword: '',
}

// ---------------------------------------------------------------------------
// Test runner
// ---------------------------------------------------------------------------
let _passed = 0
let _failed = 0
let _currentSuite = null
const _results = document.getElementById('x-results')

// Explicit async-completion signal for the Selenium runner (test_unit.py).
// finalize() runs once after the sync tests and again after the async suites,
// so the summary class is already 'all-pass'/'has-fail' before async work
// finishes — inferring completion from it can capture the sync-only snapshot.
// The runner waits on this flag instead; it is set true only after the last
// async suite has finalized. See the tail of this script.
window.__TESTS_COMPLETE__ = false

function suite(name) {
  _currentSuite = name
  const h = document.createElement('h2')
  h.textContent = name
  h.id = 'suite-' + name.replace(/\s+/g, '-').toLowerCase()
  _results.appendChild(h)
}

function test(name, fn) {
  const line = document.createElement('div')
  line.className = 'test-line'
  try {
    fn()
    _passed++
    line.classList.add('pass')
    line.textContent = '✓ ' + name
  } catch(e) {
    _failed++
    line.classList.add('fail')
    line.textContent = '✗ ' + name
    const pre = document.createElement('pre')
    pre.textContent = e.message || String(e)
    line.appendChild(pre)
  }
  _results.appendChild(line)
}

function assert(condition, msg) {
  if (!condition) throw new Error('assert failed: ' + (msg || '(no message)'))
}

function assertEqual(a, b, msg) {
  if (a !== b) throw new Error((msg || 'assertEqual') + '\n  expected: ' + JSON.stringify(b) + '\n  actual:   ' + JSON.stringify(a))
}

function assertNotEqual(a, b, msg) {
  if (a === b) throw new Error((msg || 'assertNotEqual') + ': values are equal: ' + JSON.stringify(a))
}

function assertThrows(fn, msg) {
  let threw = false
  try { fn() } catch(e) { threw = true }
  if (!threw) throw new Error((msg || 'assertThrows') + ': expected exception was not thrown')
}

async function runAsyncTest(name, fn) {
  const line = document.createElement('div')
  line.className = 'test-line'
  try {
    await fn()
    _passed++
    line.classList.add('pass')
    line.textContent = '✓ ' + name
  } catch(e) {
    _failed++
    line.classList.add('fail')
    line.textContent = '✗ ' + name
    const pre = document.createElement('pre')
    pre.textContent = e.message || String(e)
    line.appendChild(pre)
  }
  _results.appendChild(line)
}

function finalize() {
  const el = document.getElementById('x-summary')
  const total = _passed + _failed
  el.textContent = `${total} tests: ${_passed} passed, ${_failed} failed`
  el.className = 'summary ' + (_failed === 0 ? 'all-pass' : 'has-fail')
  // expose result for ChromeDriver to read
  window.__TEST_RESULTS__ = { passed: _passed, failed: _failed, total }
}

// lib.js — enableFunctionChaining and helpers

import { enableFunctionChaining, xmk, xget, xgetn } from '/js/lib.js'
enableFunctionChaining()

suite('lib.js — xmk')
test('xmk creates an element with the correct tagName', () => {

suite('lib.js — xClass / xId / xAttr / xAttrs')

})
test('xId sets the element id', () => {

})
test('xAttr sets a single attribute', () => {
  const el = xmk('input').xAttr('type', 'text')

})
test('xAttrs sets multiple attributes', () => {
  const el = xmk('input').xAttrs({ type: 'text', placeholder: 'name', required: 'true' })

  assertEqual(el.getAttribute('placeholder'), 'name')

suite('lib.js — xInnerHTML / xInnerText / xTextContent')
test('xInnerHTML sets innerHTML', () => {

test('xInnerText sets innerText', () => {

test('xAppendChild ignores null entries', () => {

test('xPrependChild inserts at the front', () => {

suite('lib.js — xStyle / xTooltip')
test('xStyle sets CSS properties', () => {
  const el = xmk('div').xStyle({ color: 'red', display: 'none' })
  assertEqual(el.style.color, 'red')
  assertEqual(el.style.display, 'none')
})
test('xTooltip sets the title attribute', () => {

suite('lib.js — xGet / xGetN / xGetParentOfType')
test('xGet finds a descendant by query', () => {
  const parent = xmk('div').xAppend(xmk('span').xId('target'))

test('xGetParentOfType traverses up to find matching tag', () => {
  const grandparent = xmk('div')
  const parent = xmk('section')
  const child = xmk('span')
  grandparent.xAppend(parent.xAppend(child))
  const found = child.xGetParentOfType('section')
  assert(found !== null)
  assertEqual(found.tagName.toLowerCase(), 'section')
})

suite('lib.js — chaining')
test('methods chain correctly', () => {
  const el = xmk('div')
    .xId('chain-test')
    .xClass('foo')
    .xAttr('data-x', 'val')
    .xTooltip('tip')
  assertEqual(el.id, 'chain-test')
  assert(el.classList.contains('foo'))
  assertEqual(el.getAttribute('data-x'), 'val')
  assertEqual(el.getAttribute('title'), 'tip')
})

suite('utils.js — sortDictByKey')

  const dict = { Banana: 2, apple: 1, Cherry: 3 }
  const sorted = sortDictByKey(dict)

  assertEqual(sorted['b'], 2)

  assertEqual(Object.keys(sorted).length, 0)
})

import { searchRecords, clearSearch } from '/js/search.js'
import { hashPrefsPassword } from '/js/prefs.js'

// Build a minimal DOM fixture: #records-accordion with some records
function makeAccordionItem(title, active, fields) {
  const item = xmk('div').xClass('accordion-item')
  const button = xmk('button').xClass('accordion-button')
  button.innerHTML = title
  button.setAttribute('x-active', active ? 'true' : 'false')
  item.appendChild(button)
  // add field name and value elements
  if (fields) {
    fields.forEach(([name, type, value]) => {
      const nameEl = xmk('span').xClass('x-fld-name')
      nameEl.innerHTML = name
      const valEl = xmk('span').xClass('x-fld-value')
      valEl.setAttribute('data-fld-type', type)
      valEl.setAttribute('data-fld-raw-value', value)
      item.appendChild(nameEl)
      item.appendChild(valEl)
    })
  }
  return item
}

const accordion = xmk('div').xId('records-accordion')
accordion.appendChild(makeAccordionItem('Amazon', true,  [['username', 'text', 'jsmith'], ['password', 'password', 'secret1']]))
accordion.appendChild(makeAccordionItem('Google', true,  [['username', 'text', 'joe@gmail.com'], ['password', 'password', 'secret2']]))
accordion.appendChild(makeAccordionItem('GitHub', true,  [['username', 'text', 'jlinoff'], ['token', 'password', 'ghp_abc123']]))
accordion.appendChild(makeAccordionItem('OldBank', false, [['account', 'text', 'inactive-acct']]))
document.body.appendChild(accordion)

// #x-num-records needed by searchRecords
const numRecordsEl = xmk('span').xId('x-num-records')
const aboutStub = xmk('div').xId('about')
document.body.appendChild(numRecordsEl)
document.body.appendChild(aboutStub)

// #search needed by clearSearch
const searchInputEl = xmk('input').xId('search')
document.body.appendChild(searchInputEl)

function visibleTitles() {
  const items = accordion.querySelectorAll('.accordion-item')
  const result = []
  for (const item of items) {
    if (!item.classList.contains('d-none')) {
      result.push(item.querySelector('.accordion-button').innerHTML)
    }
  }
  return result
}

test('title match is case-insensitive', () => {

test('partial title match works', () => {

test('no match hides all records', () => {

test('field name match works', () => {

suite('search.js — password value search')
test('password values are NOT matched by default', () => {
  // The oracle this guards against: with password matching on, typing a
  // character and watching which records survive recovers the password one
  // character at a time, without it ever appearing on screen.
  window.prefs.searchRecordFieldValues = true
  window.prefs.searchPasswordFieldValues = false
  searchRecords('secret1')
  const visible = visibleTitles()
  assert(!visible.includes('Amazon'), 'Amazon password is secret1 and must not match')
  window.prefs.searchRecordFieldValues = false
  searchRecords('.')
})
test('password values ARE matched when explicitly enabled', () => {
  window.prefs.searchRecordFieldValues = true
  window.prefs.searchPasswordFieldValues = true
  searchRecords('secret1')
  const visible = visibleTitles()
  assert(visible.includes('Amazon'), 'opting in must restore the old behaviour')
  assert(!visible.includes('Google'), 'Google password is secret2')
  window.prefs.searchPasswordFieldValues = false
  window.prefs.searchRecordFieldValues = false
  searchRecords('.')
})
test('non-password values still match with the pref off', () => {
  window.prefs.searchRecordFieldValues = true
  window.prefs.searchPasswordFieldValues = false
  searchRecords('jsmith')
  const visible = visibleTitles()
  assert(visible.includes('Amazon'), 'excluding passwords must not break value search')
  window.prefs.searchRecordFieldValues = false
  searchRecords('.')
})
test('a partial password prefix does not leak through the filter', () => {
  // Character-by-character narrowing is the actual attack, so test prefixes
  // rather than only the whole value.
  //
  // These prefixes are chosen to be unique to the password 'secret1'. Shorter
  // ones are useless as evidence: 's' occurs in the username 'jsmith' and 'se'
  // in the field name 'username', so Amazon matches those legitimately and a
  // test using them would report a leak that is not there.
  window.prefs.searchRecordFieldValues = true
  window.prefs.searchPasswordFieldValues = false
  for (const prefix of ['sec', 'secr', 'secre', 'secret', 'secret1']) {
    searchRecords(prefix)
    assert(!visibleTitles().includes('Amazon'),
           'prefix ' + prefix + ' selected on password content')
  }
  window.prefs.searchRecordFieldValues = false
  searchRecords('.')
})
test('regex probes cannot select on password content', () => {
  // Search compiles its input as a regular expression, so the oracle this
  // guards against is a binary search, not a linear walk. These are the
  // probes an attacker would actually use: anchors, character classes,
  // positional wildcards and length assertions. None may select Amazon,
  // whose password is 'secret1'.

import { encrypt, decrypt, encryptV2, decryptV2 } from '/js/crypt.js'

// Helper: wrap callback-based encrypt/decrypt in Promises
function encryptAsync(password, plaintext) {
  return new Promise((resolve, reject) => {
    // We need a real #status element (already added above)
    encrypt(password, plaintext, 'test.pam', (ciphertext, _filename) => {
      resolve(ciphertext)
    })
    // timeout failsafe
    setTimeout(() => reject(new Error('encrypt timed out')), 15000)
  })
}

function decryptAsync(password, ciphertext) {
  return new Promise((resolve, reject) => {
    decrypt(password, ciphertext,
      (plaintext) => resolve({ ok: true, plaintext }),
      (errMsg)   => resolve({ ok: false, error: errMsg })
    )
    setTimeout(() => reject(new Error('decrypt timed out')), 15000)
  })
}

function encryptV2Async(password, plaintext) {
  return new Promise((resolve, reject) => {
    encryptV2(password, plaintext, 'test.pam', (ciphertext, _filename) => {
      resolve(ciphertext)
    })
    setTimeout(() => reject(new Error('encryptV2 timed out')), 15000)
  })
}

function decryptV2Async(password, ciphertext) {
  return new Promise((resolve, reject) => {
    decryptV2(password, ciphertext,
      (plaintext) => resolve({ ok: true, plaintext }),
      (errMsg)   => resolve({ ok: false, error: errMsg })
    )
    setTimeout(() => reject(new Error('decryptV2 timed out')), 15000)
  })
}

// SEC-006 revert — lockPreferencesPassword is plaintext, not hashed
// The prefs lock is a convenience feature, not a cryptographic boundary.
// The file is already protected by the master password (AES-256-CBC).
// Hashing adds no security benefit and breaks existing files.
// ---------------------------------------------------------------------------
suite('SEC-006 revert — prefs lock uses plaintext comparison')
test('lockPreferencesPassword default is empty string', () => {
  assertEqual(window.prefs.lockPreferencesPassword, '',
    'lockPreferencesPassword should default to empty string')
})
test('lockPreferencesPassword is stored as plaintext (not a hash)', () => {
  // A SHA-256 hash would be a 64-char hex string. A plaintext password is not.
  // Set a known value and confirm it is stored verbatim.
  const saved = window.prefs.lockPreferencesPassword
  window.prefs.lockPreferencesPassword = 'my-test-password'
  assertEqual(window.prefs.lockPreferencesPassword, 'my-test-password',
    'lockPreferencesPassword should be stored as plaintext')
  assert(window.prefs.lockPreferencesPassword.length !== 64,
    'plaintext password should not look like a SHA-256 hash')
  window.prefs.lockPreferencesPassword = saved
})

suite('load.js — duplicate strategy logic')
test('ignore strategy skips duplicate titles', () => {
  // Simulate the ignore branch: findRecord returns truthy, strategy is ignore
  // We test the logic directly rather than through loadCallback DOM dependencies
  const existingTitles = new Set(['Amazon', 'Google'])
  const strategy = 'ignore'
  let loaded = []
  const records = [
    { title: 'Amazon', fields: [] },
    { title: 'GitHub', fields: [] },
  ]
  for (const rec of records) {
    if (existingTitles.has(rec.title)) {
      if (strategy === 'ignore') continue
    }
    loaded.push(rec.title)
  }
  assert(!loaded.includes('Amazon'), 'ignore should skip duplicate Amazon')
  assert(loaded.includes('GitHub'), 'ignore should load new GitHub')
})
test('replace strategy removes duplicate before inserting', () => {
  const existingTitles = new Set(['Amazon'])
  const strategy = 'replace'
  let deleted = []
  let loaded = []
  const records = [{ title: 'Amazon', fields: [] }]
  for (const rec of records) {
    if (existingTitles.has(rec.title)) {
      if (strategy === 'replace') {
        deleted.push(rec.title)
        existingTitles.delete(rec.title)
      }
    }
    loaded.push(rec.title)
  }
  assert(deleted.includes('Amazon'), 'replace should delete existing Amazon')
  assert(loaded.includes('Amazon'), 'replace should then load Amazon')
})
test('allow strategy generates unique title for duplicate', () => {
  const existingTitles = new Set(['Amazon', 'Amazon Clone'])
  const strategy = 'allow'
  let title = 'Amazon'
  if (existingTitles.has(title) && strategy === 'allow') {
    let provisional = title + ' Clone'
    let idx = 0
    while (existingTitles.has(provisional)) {
      idx++
      provisional = `${title} Clone${idx}`
    }
    title = provisional
  }
  assertEqual(title, 'Amazon Clone1',
    'allow should generate Amazon Clone1 when Amazon Clone exists')
})

// ---------------------------------------------------------------------------
// crypt.js — error surfacing regression (encrypt paths no longer swallow)
// Regression: encryptV2()/encrypt() delivered success via callback but routed
// every rejection to a bare clog(), so any failure — including a throw inside
// the consumer callback (exactly what the whitespace-class bug did) — was
// invisible; the Save button appeared to do nothing. The fix surfaces errors
// via alert/statusBlip and reports a callback throw as a 'save' failure, not
// an 'encryption' failure (encryption had in fact succeeded).
// ---------------------------------------------------------------------------
async function runSaveRegressionTests() {
  suite('crypt.js — error surfacing regression')

  // Drive encryptV2 with a callback that throws (as the download dialog did)
  // and capture what the user would actually see.
  function encryptV2WithThrowingCallback(password, plaintext, thrown) {
    return new Promise((resolve, reject) => {
      const origAlert = window.alert
      let alertMsg = null
      let sawCiphertext = false
      window.alert = (m) => { alertMsg = m }
      encryptV2(password, plaintext, 'test.pam', (ciphertext) => {
        sawCiphertext = typeof ciphertext === 'string' && ciphertext.length > 0
        throw new Error(thrown)
      })
      const t0 = Date.now()
      const poll = () => {
        if (alertMsg !== null) {
          window.alert = origAlert
          resolve({ alertMsg, sawCiphertext })
          return
        }
        if (Date.now() - t0 > 15000) {
          window.alert = origAlert
          reject(new Error('timed out waiting for the error alert'))
          return
        }
        setTimeout(poll, 20)
      }
      poll()
    })
  }

  await runAsyncTest('a throw inside the callback surfaces a visible error (not swallowed)', async () => {
    const r = await encryptV2WithThrowingCallback('pw', '{"records":[]}', 'boom')
    assert(r.alertMsg !== null, 'the user must see an alert when the callback throws')
  })

  await runAsyncTest('a callback throw is reported as a save failure, not encryption', async () => {
    const r = await encryptV2WithThrowingCallback('pw', '{"records":[]}', 'boom')
    assert(r.sawCiphertext, 'encryption itself should have succeeded before the callback threw')
    assert(r.alertMsg.includes('save'),
      'error must be labelled a save failure: ' + r.alertMsg)
    assert(!r.alertMsg.includes('encryption'),
      'error must NOT be mislabelled an encryption failure: ' + r.alertMsg)
  })

  await runAsyncTest('normal encryptV2 callback still succeeds (happy path intact)', async () => {
    const ct = await encryptV2Async('pw', '{"records":[]}')
    assert(typeof ct === 'string' && ct.startsWith('PAMv2:'),
      'ciphertext should be a v2 string, got: ' + ct)
  })

  finalize()
}

import {
  canonicalizeRecords, vaultFingerprint, secretFields, reuseGroups, reuseCount,
  partitionByActive
} from '/js/vault.js'

// Records in the shape convertInternalDataToJSON() produces. Plain literals —
// these functions never touch the DOM, so no accordion fixture is needed.
function mkrec(title, fields, active, created) {
  return {
    title: title,
    active: active === undefined ? true : active,
    created: created || '2026-01-01T00:00:00.000Z',
    fields: fields,
  }
}
function fld(name, type, value) {
  return {name: name, type: type, value: value}
}

const VAULT_A = [
  mkrec('github', [fld('username', 'text', 'joe'), fld('password', 'password', 'aaa')]),
  mkrec('gitlab', [fld('username', 'text', 'joe'), fld('password', 'password', 'bbb')]),
  mkrec('bank',   [fld('username', 'text', 'jl'),  fld('password', 'password', 'ccc')]),
]

              'record order must not change the canonical form')

test('no separator character lets one vault masquerade as another', () => {
  // Delimiter-agnostic on purpose. An earlier version of this test hardcoded
  // the separator the implementation happened to use, so it passed even when
  // the separator was changed to something forgeable — it was checking that
  // one specific character was absent, not that boundaries cannot be faked.
  // For each candidate separator, these two vaults differ but would collide
  // if the canonical form were a naive join on that character.
  const candidates = [':', '|', ',', '\t', '\n', '\u001f', '\u001e', '-', ' ', '/']
  for (const sep of candidates) {
    const a = [mkrec('x', [fld('p', 'password', 'u' + sep + 'v')])]
    const b = [mkrec('x', [fld('p', 'password' + sep + 'u', 'v')])]
    assertNotEqual(canonicalizeRecords(a), canonicalizeRecords(b),
                   'collision when separator is ' + JSON.stringify(sep))
  }
})

// ---------------------------------------------------------------------------
// vault.js — vaultFingerprint (async: crypto.subtle)
// ---------------------------------------------------------------------------
async function runVaultFingerprintTests() {
  suite('vault.js — vaultFingerprint')

  await runAsyncTest('is stable under record reordering', async () => {
    // The whole point of the feature. Two identical vaults serialised in
    // different orders must agree; an order-sensitive comparison reports a
    // difference that is not there.
    const shuffled = [VAULT_A[2], VAULT_A[0], VAULT_A[1]]
    assertEqual(await vaultFingerprint(shuffled), await vaultFingerprint(VAULT_A))
  })

  await runAsyncTest('is stable under field reordering', async () => {
    const a = [mkrec('x', [fld('u', 'text', '1'), fld('p', 'password', '2')])]
    const b = [mkrec('x', [fld('p', 'password', '2'), fld('u', 'text', '1')])]
    assertEqual(await vaultFingerprint(a), await vaultFingerprint(b))
  })

  await runAsyncTest('ignores created', async () => {
    const a = [mkrec('x', [fld('p', 'password', '1')], true, '2020-01-01T00:00:00.000Z')]
    const b = [mkrec('x', [fld('p', 'password', '1')], true, '2026-06-06T00:00:00.000Z')]
    assertEqual(await vaultFingerprint(a), await vaultFingerprint(b))
  })

  await runAsyncTest('changes when a password changes', async () => {
    const a = [mkrec('x', [fld('p', 'password', '1')])]
    const b = [mkrec('x', [fld('p', 'password', '2')])]
    assertNotEqual(await vaultFingerprint(a), await vaultFingerprint(b))
  })

  await runAsyncTest('changes when a record is added', async () => {
    const extra = VAULT_A.concat([mkrec('extra', [fld('p', 'password', 'z')])])
    assertNotEqual(await vaultFingerprint(VAULT_A), await vaultFingerprint(extra))
  })

  await runAsyncTest('changes when a record is removed', async () => {
    assertNotEqual(await vaultFingerprint(VAULT_A),
                   await vaultFingerprint(VAULT_A.slice(0, 2)))
  })

  await runAsyncTest('is deterministic across calls', async () => {
    assertEqual(await vaultFingerprint(VAULT_A), await vaultFingerprint(VAULT_A))
  })

  await runAsyncTest('formats as four groups of four hex characters', async () => {
    const fp = await vaultFingerprint(VAULT_A)
    assert(/^[0-9a-f]{4}( [0-9a-f]{4}){3}$/.test(fp), 'unexpected format: ' + fp)
  })

  await runAsyncTest('handles an empty vault', async () => {
    const fp = await vaultFingerprint([])
    assert(/^[0-9a-f]{4}( [0-9a-f]{4}){3}$/.test(fp), 'unexpected format: ' + fp)
  })

  await runAsyncTest('an empty vault differs from a populated one', async () => {
    assertNotEqual(await vaultFingerprint([]), await vaultFingerprint(VAULT_A))
  })

  // The reason the About dialogue publishes two fingerprints rather than one.
  //
  // Device A holds three active and two inactive records; device B holds the
  // same three active records and none of the inactive ones. A single
  // active-only fingerprint would report the two vaults as identical, and the
  // user would never learn that two records they deliberately kept — they
  // deactivated rather than deleted them — are missing from B.
  await runAsyncTest('a missing inactive record is detectable', async () => {
    const deviceA = [
      mkrec('a', [fld('p','password','1')], true),
      mkrec('b', [fld('p','password','2')], true),
      mkrec('old', [fld('p','password','x')], false),
    ]
    const deviceB = [
      mkrec('a', [fld('p','password','1')], true),
      mkrec('b', [fld('p','password','2')], true),
    ]
    const [aActive, aInactive] = partitionByActive(deviceA)
    const [bActive, bInactive] = partitionByActive(deviceB)

    assertEqual(await vaultFingerprint(aActive), await vaultFingerprint(bActive),
                'the live credentials really are in sync, and must say so')
    assertNotEqual(await vaultFingerprint(aInactive), await vaultFingerprint(bInactive),
                   'the archived difference must not be silently equal')
  })

  await runAsyncTest('active and inactive fingerprints are independent', async () => {
    // Changing an inactive record must not disturb the active fingerprint.
    const base = [mkrec('a', [fld('p','password','1')], true),
                  mkrec('old', [fld('p','password','x')], false)]
    const edited = [mkrec('a', [fld('p','password','1')], true),
                    mkrec('old', [fld('p','password','CHANGED')], false)]
    const [baseA, baseI] = partitionByActive(base)
    const [editA, editI] = partitionByActive(edited)
    assertEqual(await vaultFingerprint(baseA), await vaultFingerprint(editA))
    assertNotEqual(await vaultFingerprint(baseI), await vaultFingerprint(editI))
  })
}

// A second accordion, swapped in for these tests only. convertInternalDataToJSON

function mkVaultUiItem(title, active, fields) {
  const item = xmk('div').xClass('accordion-item')
  const btn = xmk('button').xClass('accordion-button')
  btn.innerHTML = title
  btn.setAttribute('x-active', active ? 'true' : 'false')
  btn.setAttribute('x-created', '2026-01-01T00:00:00.000Z')
  item.appendChild(btn)
  const body = xmk('div').xClass('accordion-body')
  fields.forEach(([name, type, value]) => {
    const row = xmk('div').xClass('row')
    const n = xmk('div').xClass('x-fld-name'); n.innerHTML = name
    const v = xmk('div').xClass('x-fld-value')
    v.setAttribute('data-fld-type', type)
    v.setAttribute('data-fld-raw-value', value)
    v.innerHTML = value
    row.appendChild(n); row.appendChild(v); body.appendChild(row)
  })
  item.appendChild(body)
  return item
}

function withVaultUiFixture(items, fn) {
  const real = document.getElementById('records-accordion')
  if (real) { real.removeAttribute('id') }
  const fixture = xmk('div').xId('records-accordion')
  items.forEach(i => fixture.appendChild(i))
  document.body.appendChild(fixture)
  const badge = xmk('span').xId('x-reuse-indicator')
  badge.style.display = 'none'
  document.body.appendChild(badge)
  try {
    fn(badge)
  } finally {
    fixture.remove()
    badge.remove()
    if (real) { real.setAttribute('id', 'records-accordion') }
  }
}

  withVaultUiFixture(REUSED_ITEMS(), (badge) => {
    window.prefs.showPasswordReuseWarning = false
    refreshVaultStats()
    assertEqual(badge.style.display, 'none')
    window.prefs.showPasswordReuseWarning = true
  })
})
test('the count is still computed when the preference is off', () => {
  // The preference suppresses the badge, not the check. There must be no
  // state in which PAM knows a password is reused and cannot tell you.
  withVaultUiFixture(REUSED_ITEMS(), () => {
    window.prefs.showPasswordReuseWarning = false
    refreshVaultStats()
    assertEqual(getCachedReuseCount(), 2, 'the check must still run')
    window.prefs.showPasswordReuseWarning = true
  })
})
test('reports the count in its text', () => {
  withVaultUiFixture(REUSED_ITEMS(), (badge) => {
    window.prefs.showPasswordReuseWarning = true
    refreshVaultStats()
    assert(badge.innerHTML.indexOf('REUSED: 2') > -1, badge.innerHTML)

suite('vault-ui.js — reuse dialogue')

suite('vault-ui.js — hideInactiveRecords scope')
test('inactive records are excluded from the report when the pref is set', () => {
  // The user's framing: an inactive record is a retired credential. A
  // collision with one is not something to act on, and reporting it is noise.
  const items = [
    mkVaultUiItem('live',    true,  [['password','password','SHARED']]),
    mkVaultUiItem('retired', false, [['password','password','SHARED']]),
  ]
  withVaultUiFixture(items, (badge) => {
    window.prefs.showPasswordReuseWarning = true
    window.prefs.hideInactiveRecords = true
    refreshVaultStats()
    assertEqual(getCachedReuseCount(), 0, 'a retired collision must not be reported')
    assertEqual(badge.style.display, 'none')
  })
})
test('inactive records are included when the pref is clear', () => {
  const items = [
    mkVaultUiItem('live',    true,  [['password','password','SHARED']]),
    mkVaultUiItem('retired', false, [['password','password','SHARED']]),
  ]
  withVaultUiFixture(items, (badge) => {
    window.prefs.showPasswordReuseWarning = true
    window.prefs.hideInactiveRecords = false
    refreshVaultStats()
    assertEqual(getCachedReuseCount(), 2, 'showing inactive records must show their collisions')
    assertEqual(badge.style.display, 'inline')
    window.prefs.hideInactiveRecords = true
  })
})
test('reuse between two active records is reported either way', () => {
  const items = [
    mkVaultUiItem('one', true, [['password','password','SHARED']]),
    mkVaultUiItem('two', true, [['password','password','SHARED']]),
    mkVaultUiItem('old', false, [['password','password','UNRELATED']]),
  ]
  withVaultUiFixture(items, () => {
    window.prefs.hideInactiveRecords = true
    refreshVaultStats()
    assertEqual(getCachedReuseCount(), 2, 'filtering must not drop an active collision')
  })
})
test('the dialogue says when inactive records were excluded', () => {
  const items = [mkVaultUiItem('a', true, [['password','password','one']])]
  withVaultUiFixture(items, () => {
    window.prefs.hideInactiveRecords = true
    refreshVaultStats()
    const dlg = menuReuseDlg()
    assert(dlg.textContent.indexOf('Inactive records are excluded') > -1,
           'a filtered report must say so; an absence is the hardest thing to notice')
  })
})

  assertEqual(getDefaultPrefs().showPasswordReuseWarning, true,
              'the nag is on by default; suppressing it is a deliberate act')
})


finalize() // update summary with sync results so far
runCryptTests()
  .then(runSaveRegressionTests)
  .then(runVaultFingerprintTests)
  .catch((err) => {
    // A throw in an async runner itself (not an individual test — those are
    // caught) would otherwise leave the flag false and strand the Selenium
    // runner until its timeout. Record it as a failure so it surfaces.
    _failed++
    const line = document.createElement('div')
    line.className = 'test-line fail'
    line.textContent = '✗ async test runner crashed'
    const pre = document.createElement('pre')
    pre.textContent = (err && err.message) || String(err)
    line.appendChild(pre)
    _results.appendChild(line)
    finalize()
  })
  .then(() => { window.__TESTS_COMPLETE__ = true })
