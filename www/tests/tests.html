<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAM Unit Tests</title>
  <style>

    h1   { color: #fff; margin-bottom: 0.25em; }
    h2   { color: #aaa; font-size: 1em; margin: 1.5em 0 0.5em; border-bottom: 1px solid #333; padding-bottom: 0.25em; }
    .summary { font-size: 1.1em; margin: 1em 0; padding: 0.5em 1em; border-radius: 4px; }
    .pass    { color: #4caf50; }
    .fail    { color: #f44336; }
    .skip    { color: #888; }
    .summary.all-pass { background: #1b3a1b; border: 1px solid #4caf50; }
    .summary.has-fail { background: #3a1b1b; border: 1px solid #f44336; }
    .test-line { margin: 2px 0; padding-left: 1em; }
    .test-line.fail { background: #2a1a1a; }
    pre  { margin: 0.25em 0 0.25em 2em; color: #f44336; font-size: 0.9em; }
    #x-summary-text { font-weight: bold; }
  </style>
</head>
<body>
  <h1>PAM Unit Tests</h1>
  <div id="x-summary" class="summary">Running...</div>
  <div id="x-results"></div>

<script type="module">

// ---------------------------------------------------------------------------
// Minimal window.prefs stub — must be set before any app module is imported
// ---------------------------------------------------------------------------
window.prefs = {
  // status
  statusMsgDurationMS: 1500,
  logStatusToConsole: false,
  // search
  searchCaseInsensitive: true,
  searchRecordTitles: true,
  searchRecordFieldNames: true,
  searchRecordFieldValues: true,
  hideInactiveRecords: false,
  // password / memorable
  memorablePasswordWordSeparator: '-',
  memorablePasswordMinWordLength: 3,
  memorablePasswordMaxWords: 6,
  memorablePasswordMinWords: 2,
  memorablePasswordMaxTries: 1000,
  memorablePasswordPrefix: '',
  memorablePasswordSuffix: '',
  passwordRangeMinLength: 8,
  passwordRangeMaxLength: 64,
  passwordRangeLengthDefault: 16,
  // file pass cache
  filePassCache: 'session',
  filePass: '',
  // misc
  themeName: 'dark',
  enableRawJSONEdit: false,
  // prefs lock (SEC-006 revert: plaintext, not hashed)
  lockPreferencesPassword: '',
}

// ---------------------------------------------------------------------------
// Test runner
// ---------------------------------------------------------------------------
let _passed = 0
let _failed = 0
let _currentSuite = null
const _results = document.getElementById('x-results')

// Explicit async-completion signal for the Selenium runner (test_unit.py).
// finalize() runs once after the sync tests and again after the async suites,
// so the summary class is already 'all-pass'/'has-fail' before async work
// finishes — inferring completion from it can capture the sync-only snapshot.
// The runner waits on this flag instead; it is set true only after the last
// async suite has finalized. See the tail of this script.
window.__TESTS_COMPLETE__ = false

function suite(name) {
  _currentSuite = name
  const h = document.createElement('h2')
  h.textContent = name
  h.id = 'suite-' + name.replace(/\s+/g, '-').toLowerCase()
  _results.appendChild(h)
}

function test(name, fn) {
  const line = document.createElement('div')
  line.className = 'test-line'
  try {
    fn()
    _passed++
    line.classList.add('pass')
    line.textContent = '✓ ' + name
  } catch(e) {
    _failed++
    line.classList.add('fail')
    line.textContent = '✗ ' + name
    const pre = document.createElement('pre')
    pre.textContent = e.message || String(e)
    line.appendChild(pre)
  }
  _results.appendChild(line)
}

function assert(condition, msg) {
  if (!condition) throw new Error('assert failed: ' + (msg || '(no message)'))
}

function assertEqual(a, b, msg) {
  if (a !== b) throw new Error((msg || 'assertEqual') + '\n  expected: ' + JSON.stringify(b) + '\n  actual:   ' + JSON.stringify(a))
}

function assertNotEqual(a, b, msg) {
  if (a === b) throw new Error((msg || 'assertNotEqual') + ': values are equal: ' + JSON.stringify(a))
}

function assertThrows(fn, msg) {
  let threw = false
  try { fn() } catch(e) { threw = true }
  if (!threw) throw new Error((msg || 'assertThrows') + ': expected exception was not thrown')
}

async function runAsyncTest(name, fn) {
  const line = document.createElement('div')
  line.className = 'test-line'
  try {
    await fn()
    _passed++
    line.classList.add('pass')
    line.textContent = '✓ ' + name
  } catch(e) {
    _failed++
    line.classList.add('fail')
    line.textContent = '✗ ' + name
    const pre = document.createElement('pre')
    pre.textContent = e.message || String(e)
    line.appendChild(pre)
  }
  _results.appendChild(line)
}

function finalize() {
  const el = document.getElementById('x-summary')
  const total = _passed + _failed
  el.textContent = `${total} tests: ${_passed} passed, ${_failed} failed`
  el.className = 'summary ' + (_failed === 0 ? 'all-pass' : 'has-fail')
  // expose result for ChromeDriver to read
  window.__TEST_RESULTS__ = { passed: _passed, failed: _failed, total }
}

suite('lib.js — xmk')

  const found = child.xGetParentOfType('section')

  assertEqual(found.tagName.toLowerCase(), 'section')
})

suite('lib.js — chaining')
test('methods chain correctly', () => {

  assertEqual(el.getAttribute('title'), 'tip')
})

// Build a minimal DOM fixture: #records-accordion with some records
function makeAccordionItem(title, active, fields) {
  const item = xmk('div').xClass('accordion-item')
  const button = xmk('button').xClass('accordion-button')
  button.innerHTML = title
  button.setAttribute('x-active', active ? 'true' : 'false')
  item.appendChild(button)
  // add field name and value elements
  if (fields) {
    fields.forEach(([name, type, value]) => {
      const nameEl = xmk('span').xClass('x-fld-name')
      nameEl.innerHTML = name
      const valEl = xmk('span').xClass('x-fld-value')
      valEl.setAttribute('data-fld-type', type)
      valEl.setAttribute('data-fld-raw-value', value)
      item.appendChild(nameEl)
      item.appendChild(valEl)
    })
  }
  return item
}

const accordion = xmk('div').xId('records-accordion')
accordion.appendChild(makeAccordionItem('Amazon', true,  [['username', 'text', 'jsmith'], ['password', 'password', 'secret1']]))
accordion.appendChild(makeAccordionItem('Google', true,  [['username', 'text', 'joe@gmail.com'], ['password', 'password', 'secret2']]))
accordion.appendChild(makeAccordionItem('GitHub', true,  [['username', 'text', 'jlinoff'], ['token', 'password', 'ghp_abc123']]))
accordion.appendChild(makeAccordionItem('OldBank', false, [['account', 'text', 'inactive-acct']]))
document.body.appendChild(accordion)

// #x-num-records needed by searchRecords

const aboutStub = xmk('div').xId('about')

document.body.appendChild(aboutStub)

function visibleTitles() {
  const items = accordion.querySelectorAll('.accordion-item')
  const result = []
  for (const item of items) {
    if (!item.classList.contains('d-none')) {
      result.push(item.querySelector('.accordion-button').innerHTML)
    }
  }
  return result
}

suite('search.js — password value search')
test('password values are NOT matched by default', () => {
  // The oracle this guards against: with password matching on, typing a
  // character and watching which records survive recovers the password one
  // character at a time, without it ever appearing on screen.
  window.prefs.searchRecordFieldValues = true
  window.prefs.searchPasswordFieldValues = false
  searchRecords('secret1')
  const visible = visibleTitles()
  assert(!visible.includes('Amazon'), 'Amazon password is secret1 and must not match')
  window.prefs.searchRecordFieldValues = false
  searchRecords('.')
})
test('password values ARE matched when explicitly enabled', () => {
  window.prefs.searchRecordFieldValues = true
  window.prefs.searchPasswordFieldValues = true
  searchRecords('secret1')
  const visible = visibleTitles()
  assert(visible.includes('Amazon'), 'opting in must restore the old behaviour')
  assert(!visible.includes('Google'), 'Google password is secret2')
  window.prefs.searchPasswordFieldValues = false
  window.prefs.searchRecordFieldValues = false
  searchRecords('.')
})
test('non-password values still match with the pref off', () => {
  window.prefs.searchRecordFieldValues = true
  window.prefs.searchPasswordFieldValues = false
  searchRecords('jsmith')
  const visible = visibleTitles()
  assert(visible.includes('Amazon'), 'excluding passwords must not break value search')
  window.prefs.searchRecordFieldValues = false
  searchRecords('.')
})
test('a partial password prefix does not leak through the filter', () => {
  // Character-by-character narrowing is the actual attack, so test prefixes
  // rather than only the whole value.
  //
  // These prefixes are chosen to be unique to the password 'secret1'. Shorter
  // ones are useless as evidence: 's' occurs in the username 'jsmith' and 'se'
  // in the field name 'username', so Amazon matches those legitimately and a
  // test using them would report a leak that is not there.
  window.prefs.searchRecordFieldValues = true
  window.prefs.searchPasswordFieldValues = false
  for (const prefix of ['sec', 'secr', 'secre', 'secret', 'secret1']) {
    searchRecords(prefix)
    assert(!visibleTitles().includes('Amazon'),
           'prefix ' + prefix + ' selected on password content')
  }
  window.prefs.searchRecordFieldValues = false
  searchRecords('.')
})
test('regex probes cannot select on password content', () => {
  // Search compiles its input as a regular expression, so the oracle this
  // guards against is a binary search, not a linear walk. These are the
  // probes an attacker would actually use: anchors, character classes,
  // positional wildcards and length assertions. None may select Amazon,
  // whose password is 'secret1'.
  window.prefs.searchRecordFieldValues = true
  window.prefs.searchPasswordFieldValues = false
  const probes = ['^sec', 'secret.$', '^[n-z]ecret1', 'sec.et1', 's.{5}1', '^.{7}$']
  for (const probe of probes) {
    searchRecords(probe)
    assert(!visibleTitles().includes('Amazon'),
           'probe ' + probe + ' selected on password content')
  }
  window.prefs.searchRecordFieldValues = false
  searchRecords('.')
})

import { encrypt, decrypt, encryptV2, decryptV2 } from '/js/crypt.js'

// Helper: wrap callback-based encrypt/decrypt in Promises
function encryptAsync(password, plaintext) {
  return new Promise((resolve, reject) => {
    // We need a real #status element (already added above)
    encrypt(password, plaintext, 'test.pam', (ciphertext, _filename) => {
      resolve(ciphertext)
    })
    // timeout failsafe
    setTimeout(() => reject(new Error('encrypt timed out')), 15000)
  })
}

function decryptAsync(password, ciphertext) {
  return new Promise((resolve, reject) => {
    decrypt(password, ciphertext,
      (plaintext) => resolve({ ok: true, plaintext }),
      (errMsg)   => resolve({ ok: false, error: errMsg })
    )
    setTimeout(() => reject(new Error('decrypt timed out')), 15000)
  })
}

function encryptV2Async(password, plaintext) {
  return new Promise((resolve, reject) => {
    encryptV2(password, plaintext, 'test.pam', (ciphertext, _filename) => {
      resolve(ciphertext)
    })
    setTimeout(() => reject(new Error('encryptV2 timed out')), 15000)
  })
}

function decryptV2Async(password, ciphertext) {
  return new Promise((resolve, reject) => {
    decryptV2(password, ciphertext,
      (plaintext) => resolve({ ok: true, plaintext }),
      (errMsg)   => resolve({ ok: false, error: errMsg })
    )
    setTimeout(() => reject(new Error('decryptV2 timed out')), 15000)
  })
}

      assert(typeof ciphertext === 'string', 'v2 ciphertext should be a string')
      assert(ciphertext.startsWith('PAMv2:'), 'v2 ciphertext must start with PAMv2: prefix')
      const result = await decryptV2Async(password, ciphertext)
      assert(result.ok, 'v2 decryption should succeed: ' + (result.error || ''))
      assertEqual(result.plaintext, plaintext, 'v2 decrypted text should match original')
      _passed++
      const line = document.createElement('div')
      line.className = 'test-line pass'

    }
  })()

  // v2 Test 2: wrong password fails
  await (async () => {
    const label = 'v2 wrong password produces decryption failure'
    try {
      const plaintext  = '{"records":[],"version":2}'
      const ciphertext = await encryptV2Async('correct-password', plaintext)

      // v2 is AES-CBC, which carries no authentication tag, so a wrong key is
      // only rejected when the garbage final block fails PKCS#7 padding
      // validation — about 255 times out of 256. Asserting !result.ok is
      // therefore flaky by construction at roughly 0.4%, and it failed in the
      // wild after many clean runs.
      //
      // The property that actually holds, and the one worth testing, is that a
      // wrong password never recovers the plaintext. When padding happens to
      // validate, decrypt() returns garbage; TextDecoder does not throw on
      // invalid UTF-8, it substitutes replacement characters.
      const result = await decryptV2Async('wrong-password', ciphertext)
      assert(!result.ok || result.plaintext !== plaintext,
             'a wrong password must never recover the original plaintext')

      // And when it does report success, what it returns must not be usable —
      // downstream that is caught by JSON.parse, which is why a wrong password
      // occasionally surfaces as "invalid record format" rather than as a
      // password error.
      if (result.ok) {
        let parsed = null
        try { parsed = JSON.parse(result.plaintext) } catch (e) { parsed = null }
        assert(parsed === null,
               'garbage from a wrong password must not parse as a vault')
      }
      _passed++
      const line = document.createElement('div')
      line.className = 'test-line pass'
      line.textContent = '✓ ' + label
      _results.appendChild(line)
    } catch(e) {
      _failed++
      const line = document.createElement('div')
      line.className = 'test-line fail'
      line.textContent = '✗ ' + label
      const pre = document.createElement('pre')
      pre.textContent = e.message || String(e)
      line.appendChild(pre)
      _results.appendChild(line)
    }
  })()

  // v2 Test 2b: the padding-validation rate, stated rather than assumed.
  await (async () => {
    const label = 'v2 rejects most wrong passwords by padding validation'
    try {
      const plaintext  = '{"records":[],"version":2}'
      const ciphertext = await encryptV2Async('correct-password', plaintext)

      // Twenty attempts. With a ~0.4% pass rate the expected number that slip
      // through is 0.08, so requiring at least 15 rejections is far from the
      // edge while still failing loudly if authentication were removed
      // entirely or the key derivation stopped depending on the password.
      let rejected = 0
      for (let i = 0; i < 20; i++) {
        const r = await decryptV2Async('wrong-password-' + i, ciphertext)
        if (!r.ok) { rejected++ }
        else { assertNotEqual(r.plaintext, plaintext,
                              'no wrong password may recover the plaintext') }
      }
      assert(rejected >= 15,
             `expected most wrong passwords to be rejected, got ${rejected}/20`)
      _passed++
      const line = document.createElement('div')
      line.className = 'test-line pass'
      line.textContent = '✓ ' + label
      _results.appendChild(line)
    } catch(e) {
      _failed++
      const line = document.createElement('div')
      line.className = 'test-line fail'
      line.textContent = '✗ ' + label
      const pre = document.createElement('pre')
      pre.textContent = e.message || String(e)
      line.appendChild(pre)
      _results.appendChild(line)
    }
  })()

  // v2 Test 3: cross-path rejection — v1 ciphertext rejected by decryptV2
  await (async () => {
    const label = 'v2 path rejects ciphertext without PAMv2: prefix'
    try {
      const plaintext  = '{"records":[]}'
      const v1cipher   = await encryptAsync('password', plaintext)
      assert(!v1cipher.startsWith('PAMv2:'), 'v1 ciphertext should not have PAMv2: prefix')
      const result = await decryptV2Async('password', v1cipher)

      const pre = document.createElement('pre')
      pre.textContent = e.message || String(e)
      line.appendChild(pre)
      _results.appendChild(line)
    }
  })()

  // v2 Test 4: unified decrypt() dispatches v2 ciphertext to v2 path
  await (async () => {
    const label = 'unified decrypt() dispatches PAMv2: prefix to v2 path'
    try {
      const plaintext  = '{"records":[],"version":2}'
      const password   = 'dispatch-test-password'
      const ciphertext = await encryptV2Async(password, plaintext)
      assert(ciphertext.startsWith('PAMv2:'), 'v2 ciphertext must have PAMv2: prefix')
      const result = await decryptAsync(password, ciphertext)
      assert(result.ok, 'unified decrypt should succeed on v2 ciphertext: ' + (result.error || ''))
      assertEqual(result.plaintext, plaintext, 'unified decrypt should return correct plaintext')
      _passed++
      const line = document.createElement('div')
      line.className = 'test-line pass'
      line.textContent = '✓ ' + label
      _results.appendChild(line)
    } catch(e) {
      _failed++
      const line = document.createElement('div')
      line.className = 'test-line fail'
      line.textContent = '✗ ' + label
      const pre = document.createElement('pre')
      pre.textContent = e.message || String(e)
      line.appendChild(pre)
      _results.appendChild(line)
    }
  })()

  // v2 Test 5: v2 and v1 ciphertexts are not interchangeable
  await (async () => {
    const label = 'v2 ciphertext cannot be decrypted by v1 path'
    try {
      const plaintext  = '{"records":[]}'
      const password   = 'cross-version-password'
      const v2cipher   = await encryptV2Async(password, plaintext)
      // Strip the PAMv2: prefix to trick v1 path into trying to decrypt it
      const stripped   = v2cipher.slice('PAMv2:'.length)
      const result     = await decryptAsync(password, stripped)
      // v1 path will fail because the key derivation is different (raw salt vs encoded)
      assert(!result.ok, 'v1 path should fail to decrypt v2 ciphertext (different key derivation)')
      _passed++
      const line = document.createElement('div')
      line.className = 'test-line pass'
      line.textContent = '✓ ' + label
      _results.appendChild(line)
    } catch(e) {
      _failed++
      const line = document.createElement('div')
      line.className = 'test-line fail'
      line.textContent = '✗ ' + label
      const pre = document.createElement('pre')
      pre.textContent = e.message || String(e)
      line.appendChild(pre)
      _results.appendChild(line)
    }
  })()

  finalize()
}

    'without re-storing, password is lost after sessionStorage wipe — confirms the bug existed')
  // Cleanup
  localStorage.removeItem('filePass')
  window.prefs.filePassCache = 'session'
})
test('no cross-bucket leak: re-storing clears old sessionStorage entry', () => {
  window.prefs.filePassCache = 'session'
  sessionStorage.removeItem('filePass')
  localStorage.removeItem('filePass')
  setFilePass('hunter2')
  assertEqual(sessionStorage.getItem('filePass'), 'hunter2', 'in sessionStorage initially')

  // Apply fix: clear old bucket, switch strategy, re-store
  clearFilePass()  // removes from sessionStorage
  window.prefs.filePassCache = 'local'
  setFilePass('hunter2')

  assertEqual(sessionStorage.getItem('filePass'), null,
    'old sessionStorage bucket should be cleared after strategy switch')
  assertEqual(localStorage.getItem('filePass'), 'hunter2',
    'password should be in new localStorage bucket')

  // Cleanup
  clearFilePass()
  window.prefs.filePassCache = 'session'
})

// Phase 3 — SEC-008: CSP meta tag in index.html
// ---------------------------------------------------------------------------
suite('SEC-008 — CSP meta tag in index.html')
test('index.html contains Content-Security-Policy meta tag', async () => {
  const html = await fetch('/index.html').then(r => r.text())
  assert(html.includes('Content-Security-Policy'),
    'index.html should contain a Content-Security-Policy meta tag (SEC-008)')
})
test("CSP includes script-src 'self'", async () => {
  const html = await fetch('/index.html').then(r => r.text())
  assert(html.includes("script-src 'self'"),
    "CSP should include script-src 'self'")
})
// Pull the policy out of the meta tag rather than searching the whole file.
// index.html carries an HTML comment explaining the connect-src change, and a
// naive /connect-src ([^;"]*)/ against the document matches THAT first — which
// is how the first version of these tests passed while parsing prose.
async function cspPolicy() {
  const html = await fetch('/index.html').then(r => r.text())
  const tag = html.match(
    /<meta[^>]*http-equiv=["']Content-Security-Policy["'][^>]*>/i)
  assert(tag, 'no Content-Security-Policy meta tag found')
  // Capture the quote character and match its pair. A naive
  // /content=["']([^"']*)["']/ stops at the first single quote INSIDE the
  // policy — and every CSP contains 'self', so it returned "default-src ".
  const content = tag[0].match(/content=(["'])([\s\S]*?)\1/i)
  assert(content, 'CSP meta tag has no content attribute')
  return content[2]
}

function cspDirective(policy, name) {
  const found = policy.split(';')
    .map(part => part.trim())
    .filter(part => part.startsWith(name + ' '))
  assertEqual(found.length, 1, `expected exactly one ${name} directive`)
  return found[0].slice(name.length).trim().split(/\s+/).filter(Boolean)
}

test('connect-src permits the breach-check host', async () => {
  // v2.4.0 relaxed connect-src so the optional breach check can reach the
  // HIBP range API. Before this, connect-src fell back to default-src 'self'
  // and the fetch was blocked by policy.
  const policy = await cspPolicy()
  assert(policy.includes('connect-src'),
    'CSP should declare connect-src explicitly, not inherit default-src')
  const allowed = cspDirective(policy, 'connect-src')
  assert(allowed.includes("'self'"), "connect-src should still include 'self'")
  assert(allowed.includes('https://api.pwnedpasswords.com'),
    'connect-src should permit the HIBP range API')
})
test('connect-src permits nothing beyond that one host', async () => {
  // The point of this test is not the change that was made but the ones that
  // might be made later. Widening connect-src is how a local-only application
  // stops being one, a host at a time, each addition reasonable on its own.
  // Adding a host here should require deleting an assertion that says why not.
  const policy = await cspPolicy()
  const allowed = cspDirective(policy, 'connect-src')
  const expected = ["'self'", 'https://api.pwnedpasswords.com']
  assertEqual(allowed.slice().sort().join(' '), expected.slice().sort().join(' '),
    'connect-src should permit exactly self and the HIBP range API')
})
test('no other directive was widened', async () => {
  const policy = await cspPolicy()
  assertEqual(cspDirective(policy, 'default-src').join(' '), "'self'",
    "default-src must stay 'self'")
  assertEqual(cspDirective(policy, 'style-src').join(' '), "'self'",
    "style-src must stay 'self'")
  assertEqual(cspDirective(policy, 'font-src').join(' '), "'self'",
    "font-src must stay 'self'")
  assertEqual(cspDirective(policy, 'img-src').join(' '), "'self' data:",
    'img-src must stay self and data:')
})

suite('load.js — duplicate strategy logic')
test('ignore strategy skips duplicate titles', () => {
  // Simulate the ignore branch: findRecord returns truthy, strategy is ignore
  // We test the logic directly rather than through loadCallback DOM dependencies
  const existingTitles = new Set(['Amazon', 'Google'])
  const strategy = 'ignore'
  let loaded = []
  const records = [
    { title: 'Amazon', fields: [] },
    { title: 'GitHub', fields: [] },
  ]
  for (const rec of records) {
    if (existingTitles.has(rec.title)) {
      if (strategy === 'ignore') continue
    }
    loaded.push(rec.title)
  }
  assert(!loaded.includes('Amazon'), 'ignore should skip duplicate Amazon')
  assert(loaded.includes('GitHub'), 'ignore should load new GitHub')
})
test('replace strategy removes duplicate before inserting', () => {
  const existingTitles = new Set(['Amazon'])
  const strategy = 'replace'
  let deleted = []
  let loaded = []
  const records = [{ title: 'Amazon', fields: [] }]
  for (const rec of records) {
    if (existingTitles.has(rec.title)) {
      if (strategy === 'replace') {
        deleted.push(rec.title)
        existingTitles.delete(rec.title)
      }
    }
    loaded.push(rec.title)
  }
  assert(deleted.includes('Amazon'), 'replace should delete existing Amazon')
  assert(loaded.includes('Amazon'), 'replace should then load Amazon')
})
test('allow strategy generates unique title for duplicate', () => {
  const existingTitles = new Set(['Amazon', 'Amazon Clone'])
  const strategy = 'allow'
  let title = 'Amazon'
  if (existingTitles.has(title) && strategy === 'allow') {
    let provisional = title + ' Clone'
    let idx = 0
    while (existingTitles.has(provisional)) {
      idx++
      provisional = `${title} Clone${idx}`
    }
    title = provisional
  }
  assertEqual(title, 'Amazon Clone1',
    'allow should generate Amazon Clone1 when Amazon Clone exists')
})

// ---------------------------------------------------------------------------
// crypt.js — error surfacing regression (encrypt paths no longer swallow)
// Regression: encryptV2()/encrypt() delivered success via callback but routed
// every rejection to a bare clog(), so any failure — including a throw inside
// the consumer callback (exactly what the whitespace-class bug did) — was
// invisible; the Save button appeared to do nothing. The fix surfaces errors
// via alert/statusBlip and reports a callback throw as a 'save' failure, not
// an 'encryption' failure (encryption had in fact succeeded).
// ---------------------------------------------------------------------------
async function runSaveRegressionTests() {
  suite('crypt.js — error surfacing regression')

  // Drive encryptV2 with a callback that throws (as the download dialog did)
  // and capture what the user would actually see.
  function encryptV2WithThrowingCallback(password, plaintext, thrown) {
    return new Promise((resolve, reject) => {
      const origAlert = window.alert
      let alertMsg = null
      let sawCiphertext = false
      window.alert = (m) => { alertMsg = m }
      encryptV2(password, plaintext, 'test.pam', (ciphertext) => {
        sawCiphertext = typeof ciphertext === 'string' && ciphertext.length > 0
        throw new Error(thrown)
      })
      const t0 = Date.now()
      const poll = () => {
        if (alertMsg !== null) {
          window.alert = origAlert
          resolve({ alertMsg, sawCiphertext })
          return
        }
        if (Date.now() - t0 > 15000) {
          window.alert = origAlert
          reject(new Error('timed out waiting for the error alert'))
          return
        }
        setTimeout(poll, 20)
      }
      poll()
    })
  }

  await runAsyncTest('a throw inside the callback surfaces a visible error (not swallowed)', async () => {
    const r = await encryptV2WithThrowingCallback('pw', '{"records":[]}', 'boom')
    assert(r.alertMsg !== null, 'the user must see an alert when the callback throws')
  })

  await runAsyncTest('a callback throw is reported as a save failure, not encryption', async () => {
    const r = await encryptV2WithThrowingCallback('pw', '{"records":[]}', 'boom')
    assert(r.sawCiphertext, 'encryption itself should have succeeded before the callback threw')
    assert(r.alertMsg.includes('save'),
      'error must be labelled a save failure: ' + r.alertMsg)
    assert(!r.alertMsg.includes('encryption'),
      'error must NOT be mislabelled an encryption failure: ' + r.alertMsg)
  })

  await runAsyncTest('normal encryptV2 callback still succeeds (happy path intact)', async () => {
    const ct = await encryptV2Async('pw', '{"records":[]}')
    assert(typeof ct === 'string' && ct.startsWith('PAMv2:'),
      'ciphertext should be a v2 string, got: ' + ct)
  })

  finalize()
}

// Run sync tests first, then the async suites (each finalizes when done).
// ---------------------------------------------------------------------------
// breach.js — failure handling and response parsing
//
// Written FIRST and deliberately. PAM is a PWA: being offline is a normal
// state, not an error, so a user who cannot reach the corpus must never see a
// result that reads as clean. Every test in the first suite asserts
// CANNOT_DETERMINE; none asserts a successful lookup.
// ---------------------------------------------------------------------------
import {
  parseRangeResponse, lookupPassword, sha1Hex,
  keyboardRun, characterSequence, repeatedCharacter, embeddedYear,
  entropyBits, structuralWeaknesses, verdictFor,
  probeCorpus, checkAll,
  FOUND, NOT_FOUND, CANNOT_DETERMINE,
  ACCEPT, REJECT, UNDETERMINED
} from '/js/breach.js'

// ---------------------------------------------------------------------------
// breach.js — failure handling
//
// These are written FIRST and deliberately. PAM is a PWA: being offline is a
// normal state, not an error, so a user who cannot reach the corpus must never
// see a result that reads as clean.
//
// Every test here asserts CANNOT_DETERMINE. None of them asserts a successful
// lookup — that is the next suite. The bug this guards against appeared three
// times in three disguises while building the command-line version, and every
// time the program looked like it worked.
// ---------------------------------------------------------------------------

// A fetch that fails the way a given scenario fails.
function fakeFetch(behaviour) {
  return async () => {
    if (behaviour.throws) { throw behaviour.throws }
    return {
      ok: behaviour.ok !== false,
      status: behaviour.status || 200,
      text: async () => {
        if (behaviour.textThrows) { throw behaviour.textThrows }
        return behaviour.body
      },
    }
  }
}

async function runBreachTests1() {
  suite('breach.js — a failed lookup never reads as clean')

  await runAsyncTest('an unreachable host cannot determine', async () => {
    const r = await lookupPassword('hunter2',
      fakeFetch({throws: new TypeError('Failed to fetch')}))
    assertEqual(r.status, CANNOT_DETERMINE,
                'offline must not be reported as not-found')
    assert(r.reason.length > 0, 'a failure should say why')
  })

  await runAsyncTest('an HTTP error cannot determine', async () => {
    // The body is deliberately a VALID range response. An error status served
    // with a parseable body is the case where only the status check saves us:
    // with an empty or malformed body the parser would reject it anyway, and
    // the test would pass without exercising the status check at all. It did,
    // until a mutation run showed the check could be deleted with every test
    // still green.
    const hash = await sha1Hex('hunter2')
    const body = hash.slice(5) + ':500'
    const r = await lookupPassword('hunter2',
      fakeFetch({ok: false, status: 503, body}))
    assertEqual(r.status, CANNOT_DETERMINE,
                'an error status must not yield a verdict, however good the body looks')
    assert(r.reason.indexOf('503') > -1, 'the status should be reported')
  })

  await runAsyncTest('an HTML error page cannot determine', async () => {
    // A captive portal or proxy answering 200 with a courtesy page. This is
    // the case that most looks like success: the request succeeded, the body
    // simply is not a range response.
    const r = await lookupPassword('hunter2', fakeFetch({
      body: '<!DOCTYPE html><html><body><h1>502 Bad Gateway</h1></body></html>'}))
    assertEqual(r.status, CANNOT_DETERMINE,
                'an HTML body must never be read as "not in the corpus"')
  })

  await runAsyncTest('an empty body cannot determine', async () => {
    const r = await lookupPassword('hunter2', fakeFetch({body: ''}))
    assertEqual(r.status, CANNOT_DETERMINE)
  })

  await runAsyncTest('a whitespace-only body cannot determine', async () => {
    const r = await lookupPassword('hunter2', fakeFetch({body: '   \n  \n'}))
    assertEqual(r.status, CANNOT_DETERMINE)
  })

  await runAsyncTest('one malformed line condemns the whole body', async () => {
    // The entry we care about may be in the part we could not read, so a
    // partially valid response is not one we can reason about.
    const hash = await sha1Hex('hunter2')
    const suffix = hash.slice(5)
    const body = [
      '0000000000000000000000000000000000A:3',
      'this line is not a hash at all',
      suffix + ':99',
    ].join('\n')
    const r = await lookupPassword('hunter2', fakeFetch({body}))
    assertEqual(r.status, CANNOT_DETERMINE,
                'a body with any unparseable line must not yield a verdict')
  })

  await runAsyncTest('a body that cannot be read cannot determine', async () => {
    const r = await lookupPassword('hunter2',
      fakeFetch({textThrows: new Error('stream closed')}))
    assertEqual(r.status, CANNOT_DETERMINE)
  })

  await runAsyncTest('a response object of the wrong shape cannot determine', async () => {
    const r = await lookupPassword('hunter2', async () => undefined)
    assertEqual(r.status, CANNOT_DETERMINE)
  })

  await runAsyncTest('an empty password cannot determine', async () => {
    const r = await lookupPassword('', fakeFetch({body: 'x'}))
    assertEqual(r.status, CANNOT_DETERMINE,
                'nothing was checked, so nothing can be concluded')
  })
}

async function runBreachTests2() {
  suite('breach.js — padding decoys are not hits')

  await runAsyncTest('our own suffix with a count of zero is padding', async () => {
    // Add-Padding mixes synthetic zero-count entries in so the response length
    // reveals nothing. Our suffix can legitimately appear among them, and
    // treating that as a match would report a breach that did not happen.
    const hash = await sha1Hex('hunter2')
    const suffix = hash.slice(5)
    const r = await lookupPassword('hunter2', fakeFetch({body: suffix + ':0'}))
    assertEqual(r.status, NOT_FOUND,
                'a zero count is padding, not a breach')
    assertEqual(r.count, 0)
  })

  await runAsyncTest('a real hit alongside padding is still a hit', async () => {
    const hash = await sha1Hex('hunter2')
    const suffix = hash.slice(5)
    const body = [
      '0000000000000000000000000000000000A:0',
      suffix + ':17',
      '0000000000000000000000000000000000B:0',
    ].join('\n')
    const r = await lookupPassword('hunter2', fakeFetch({body}))
    assertEqual(r.status, FOUND)
    assertEqual(r.count, 17)
  })
}

async function runBreachTests3() {
  suite('breach.js — parseRangeResponse')

  const suffix = 'A'.repeat(35)

  test('rejects a non-string body', () => {
    assertEqual(parseRangeResponse(null, suffix).ok, false)
    assertEqual(parseRangeResponse(undefined, suffix).ok, false)
    assertEqual(parseRangeResponse(42, suffix).ok, false)
  })
  test('rejects a suffix that is not 35 hex characters', () => {
    assertEqual(parseRangeResponse('X:1', 'TOO-SHORT').ok, false)
    assertEqual(parseRangeResponse('X:1', 'Z'.repeat(35)).ok, false)
  })
  test('a well-formed miss is a miss, not a failure', () => {
    const r = parseRangeResponse('B'.repeat(35) + ':4', suffix)
    assertEqual(r.ok, true)
    assertEqual(r.found, false)
  })
  test('accepts lowercase hex from the wire', () => {
    const r = parseRangeResponse(suffix.toLowerCase() + ':7', suffix)
    assertEqual(r.ok, true)
    assertEqual(r.found, true)
    assertEqual(r.count, 7)
  })
  test('tolerates CRLF line endings', () => {
    const body = 'B'.repeat(35) + ':4\r\n' + suffix + ':9\r\n'
    const r = parseRangeResponse(body, suffix)
    assertEqual(r.ok, true)
    assertEqual(r.count, 9)
  })
}


async function runBreachTests4() {
  suite('breach.js — structural weakness')

  test('a keyboard run is caught, forwards and backwards', () => {
    assertEqual(keyboardRun('Xqwertyz'), 'qwer')
    assert(keyboardRun('poiu9') !== null, 'reversed rows count too')
    assertEqual(keyboardRun('Zq7-Mvtl%Kdn#WroP2xj'), null)
  })
  test('a character sequence is caught, forwards and backwards', () => {
    assertEqual(characterSequence('Xabcdz'), 'abcd')
    assertEqual(characterSequence('x4321y'), '4321')
    assertEqual(characterSequence('Zq7-Mvtl%Kdn#WroP2xj'), null)
  })
  test('four of the same character is a repeat, three is not', () => {
    assertEqual(repeatedCharacter('xaaaay'), 'aaaa')
    assertEqual(repeatedCharacter('xaaay'), null)
  })
  test('only plausible years count', () => {
    assertEqual(embeddedYear('Summer2026'), '2026')
    assertEqual(embeddedYear('x4291y'), null,
                '4291 is not being used as a year; objecting would be noise')
  })
  test('entropy rises with length and alphabet', () => {
    assert(entropyBits('Zq7-Mvtl%Kdn#WroP2xj') > 100, 'a strong password')
    assert(entropyBits('abc') < 20, 'a short lowercase one')
    assertEqual(entropyBits(''), 0)
  })
  test('weak passwords are objected to with a reason', () => {
    for (const weak of ['Summer2026', 'qwerty123456', 'password1234',
                        'aaaaaaaaaaaa', 'abcdefghijkl', 'short']) {
      const reasons = structuralWeaknesses(weak)
      assert(reasons.length > 0, `${weak} should be objected to`)
    }
  })
  test('PAM-generated passwords are not falsely rejected', () => {
    // The risk with structural checks is not missing a weak password, it is
    // rejecting a good one: that teaches people to ignore the tool. These are
    // real values from www/examples/example.txt and from the generator.
    const good = [
      'hr5Hn9pqm3u.VqMiALfdN-"',
      'rHfZ6bihw$g8ra$P4hHD',
      'dOa#DirgJge67okTKtEzp.LSl',
      'Aq7GdcOmYWVkyHEWEk6fBeJzm',
      'NIJMeb8OfXEfshOG$db!',
      'cGwJ$NPQ4SsI#haEsFRD',
      'FpnzQcuq0nk/PxlMdYJ_itnK',
      'M+pSIWOMODrwiHteA+#3',
      // Five-word memorable passwords, generated at the v2.4.0 defaults.
      //
      // These were three-word examples until the entropy estimate learned
      // about dictionary words. They are now correctly rejected at 40 bits,
      // and that is the point of the change rather than a regression: this
      // suite exists to check that PAM does not reject its OWN current output,
      // and its own current output is five words.
      'latinas/slowly/los/sheets/have',
      'asylum/academy/sol/oliver/tone',
      'annex/london/ssl/stats/connect',
    ]
    for (const password of good) {
      const reasons = structuralWeaknesses(password)
      assertEqual(reasons.length, 0,
                  `${password} was falsely rejected: ${reasons.join('; ')}`)
    }
  })
}

async function runBreachTests5() {
  suite('breach.js — the verdict')

  const STRONG = 'Zq7-Mvtl%Kdn#WroP2xj'
  const hit = {status: FOUND, count: 42, reason: ''}
  const miss = {status: NOT_FOUND, count: 0, reason: ''}
  const down = {status: CANNOT_DETERMINE, count: 0, reason: 'offline'}

  test('a corpus hit rejects', () => {
    const v = verdictFor(STRONG, hit)
    assertEqual(v.verdict, REJECT)
    assert(v.reasons[0].indexOf('42') > -1, 'the count should be reported')
  })
  test('a clean miss accepts', () => {
    assertEqual(verdictFor(STRONG, miss).verdict, ACCEPT)
  })
  test('a failed lookup is undetermined, never accept', () => {
    // The fail-open bug, in one assertion.
    assertEqual(verdictFor(STRONG, down).verdict, UNDETERMINED)
    assertEqual(verdictFor(STRONG, down).checkedCorpus, false)
  })
  test('a weak password is rejected even when the corpus is unreachable', () => {
    // The structural checks need no network, so being offline is no reason to
    // withhold an objection that can be made locally.
    assertEqual(verdictFor('Summer2026', down).verdict, REJECT)

async function runBreachTests6() {
  suite('breach.js — running a check over many passwords')

  const STRONG_A = 'Zq7-Mvtl%Kdn#WroP2xj'
  const STRONG_B = 'Bx4!qWne%Ldk#TmoR8zv'
  const okBody = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA:1'
  const okFetch = async () => ({ok: true, status: 200, text: async () => okBody})
  const candidates = (values) =>
    values.map(v => ({value: v, entries: [{title: v, name: 'password'}]}))

  await runAsyncTest('an unreachable corpus stops before any real request', async () => {
    // One failure reported once, rather than several hundred identical ones
    // accumulating while the user watches.
    let calls = 0
    const fetchFn = async () => { calls++; throw new TypeError('offline') }
    const out = await checkAll(candidates([STRONG_A, STRONG_B]), fetchFn, {delayMs: 0})
    assertEqual(out.probeFailed, true)
    assertEqual(out.results.length, 0)
    assertEqual(calls, 1, 'exactly one request: the probe')
    assert(out.reason.length > 0, 'it should say why')
  })

  await runAsyncTest('progress is reported for every candidate', async () => {
    const seen = []
    await checkAll(candidates([STRONG_A, STRONG_B]), okFetch,
                   {delayMs: 0, onProgress: (d, t) => seen.push(d + '/' + t)})
    assertEqual(seen.join(' '), '1/2 2/2')
  })

  await runAsyncTest('cancelling stops the run and reports that it stopped', async () => {
    // A run over a few hundred passwords takes about a minute. Starting one
    // and being unable to stop it would be a poor bargain.
    let n = 0
    const out = await checkAll(candidates([STRONG_A, STRONG_B, STRONG_A, STRONG_B]),
                               okFetch, {delayMs: 0, isCancelled: () => n++ >= 2})
    assertEqual(out.cancelled, true)
    assert(out.results.length < 4, 'it should not have finished')
  })

  await runAsyncTest('a mid-run failure is undetermined, never clean', async () => {
    // The case the whole feature is built around: the probe succeeds, then the
    // network goes away. Those passwords must not be reported as fine.
    //
    // The passwords are structurally STRONG on purpose. With weak ones the
    // verdict would be REJECT on structural grounds and this test would pass
    // without exercising what it names — which is what the first version did.
    let n = 0
    const fetchFn = async () => {
      n++
      if (n === 1) { return {ok: true, status: 200, text: async () => okBody} }
      throw new TypeError('network went away')
    }
    const out = await checkAll(candidates([STRONG_A, STRONG_B]), fetchFn, {delayMs: 0})
    assertEqual(out.probeFailed, false, 'the probe succeeded')
    for (const result of out.results) {
      assertEqual(result.verdict, UNDETERMINED,
                  'a failed lookup must never read as clean')
    }
  })

  await runAsyncTest('the probe reports an HTTP error', async () => {
    const out = await probeCorpus(async () => ({ok: false, status: 503}))
    assertEqual(out.ok, false)
    assert(out.reason.indexOf('503') > -1)
  })
}


async function runBreachTests7() {
  suite('breach-ui.js — a run can be restarted after closing')

  await runAsyncTest('an empty vault still has a report body', async () => {
    // readyBody() omitted the progress and results containers when there was
    // nothing to check, so pressing Check on an empty vault reported an
    // internal error. The containers are now always present, and Check is
    // hidden when there is no work for it.
    const saved = window.prefs.enablePasswordBreachCheck
    window.prefs.enablePasswordBreachCheck = true
    try {
      withVaultUiFixture([], () => {
        const dlg = menuBreachDlg()
        document.body.appendChild(dlg)
        try {
          dlg.dispatchEvent(new Event('show.bs.modal'))
          assert(document.getElementById('x-breach-progress'),
                 'the progress container must exist even with nothing to check')
          assert(document.getElementById('x-breach-results'),
                 'so must the results container')
          const check = document.getElementById('x-breach-check-button')
          assertEqual(check.style.display, 'none',
                      'Check should be hidden when there is nothing to check')
        } finally {
          dlg.remove()
        }
      })
    } finally {
      window.prefs.enablePasswordBreachCheck = saved
    }
  })

  await runAsyncTest('closing the dialogue cancels the run', async () => {
    // The sequence that broke it: start a check, close the dialogue while it
    // is going, reopen. The run kept sending requests nobody was watching,
    // reopening rebuilt the body and orphaned the progress element, and the
    // `running` flag then blocked a new run — so Check did nothing, silently.
    const saved = window.prefs.enablePasswordBreachCheck
    const savedFetch = window.fetch
    window.prefs.enablePasswordBreachCheck = true

    // A slow fetch, so the run is still going when the dialogue closes.
    window.fetch = async () => {
      await new Promise((resolve) => { setTimeout(resolve, 30) })
      return {ok: true, status: 200,
              text: async () => 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA:1'}
    }

    const items = [
      mkVaultUiItem('a', true, [['password','password','Zq7-Mvtl%Kdn#WroP2xj']]),
      mkVaultUiItem('b', true, [['password','password','Bx4!qWne%Ldk#TmoR8zv']]),
      mkVaultUiItem('c', true, [['password','password','Ny2@rTce$Jhq#PlmX5wb']]),
    ]
    try {
      const dlg = menuBreachDlg()
      document.body.appendChild(dlg)
      try {
        await new Promise((resolve) => {
          withVaultUiFixture(items, async () => {
            dlg.dispatchEvent(new Event('show.bs.modal'))
            const first = startBreachCheck()
            // Close while it is still running.
            await new Promise((r) => { setTimeout(r, 20) })
            dlg.dispatchEvent(new Event('hide.bs.modal'))
            await first
            resolve()
          })
        })

        // Reopen and check the body was rebuilt. Before the fix the `running`
        // flag was still set and a new run returned immediately, silently.
        //
        // This must happen INSIDE the fixture: outside it the vault is empty,
        // readyBody() takes its no-passwords branch, and the assertion below
        // fails for a reason that has nothing to do with what is being tested.
        // The first version of this test did exactly that.
        withVaultUiFixture(items, () => {
          dlg.dispatchEvent(new Event('show.bs.modal'))
          const progress = document.getElementById('x-breach-progress')
          assert(progress, 'reopening should rebuild the report body')
          assert(progress.innerHTML.indexOf('Checking') === -1,
                 'the rebuilt body should not show a stale run in progress')
        })
      } finally {
        dlg.remove()
      }
    } finally {
      window.prefs.enablePasswordBreachCheck = saved
      window.fetch = savedFetch
    }
  })
}

async function runBreachTests11() {
  suite('password.js — the breach check in the standalone generator')

  const savedPref = window.prefs.enablePasswordBreachCheck

  // bootstrap.Modal.getOrCreateInstance(). This page does not load Bootstrap's
  // JavaScript at all, so that global is undefined here and the call throws
  // before the body is built.
  //
  // Stubbed for the duration rather than working around it: the population is
  // the part under test, and a stub keeps the test exercising the real
  // function instead of a reimplementation of what it does.
  function withGenerator(fn) {
    // showMainPasswordGeneratorDlg() finds its target with
    // getElementById('mainPasswordGeneratorDlg'), so any earlier dialogue left
    // attached with that id would be populated instead of this one. Clear the
    // id before appending so the lookup cannot resolve to something else.
    for (const stale of document.querySelectorAll('#mainPasswordGeneratorDlg')) {
      stale.remove()
    }

    document.body.appendChild(dlg)

    try {

      assertEqual(document.getElementById('mainPasswordGeneratorDlg'), dlg,
                  'getElementById should resolve to the dialogue just built')
      const body = dlg.querySelector('.modal-body')
      assert(body, 'the dialogue should have a .modal-body')
      assert(body.children.length > 0,
             'showMainPasswordGeneratorDlg() should have populated the body')
      return fn(dlg)
    } finally {
      dlg.remove()
      if (hadBootstrap) {
        window.bootstrap = savedBootstrap
      } else {
        delete window.bootstrap
      }
    }

  // Builds a populated generator and returns its first check button, leaving
  // the dialogue attached so an async click can be awaited against it. The
  // caller removes it.

                  `the fixture should expose two records, saw ${JSON.stringify(
                      seen.map(r => r.title))}`)
      assertEqual(getCachedReuseCount(), 2,
                  'the fixture should produce one reuse group of two entries')
      assertEqual(canSelectRecords(), true,
                  'searchRecordTitles was just set')

      let dlg = menuReuseDlg()
      assert(dlg.querySelector('.x-reuse-group-select'),
             'clickable while titles are searched')
      assert(dlg.textContent.indexOf('currently off') === -1, 'and no warning')

      window.prefs.searchRecordTitles = false
      dlg = menuReuseDlg()
      assert(!dlg.querySelector('.x-reuse-group-select'),

      assert(dlg.textContent.indexOf('Search Record Titles') > -1,

  })

  test('the breach report does the same', () => {
    const progress = xmk('div')
    const results = xmk('div')
    document.body.appendChild(progress)
    document.body.appendChild(results)
    try {

                                 {status: NOT_FOUND, count: 0, reason: ''})
      const outcome = {probeFailed: false, cancelled: false, results: [
        Object.assign({entries: [{title: 'Facebook', name: 'password'}]}, verdict)]}

      window.prefs.searchRecordTitles = false
      renderBreachResults(progress, results, outcome, 1)
      assert(!results.querySelector('.x-breach-record-select'),
             'titles are plain text when selection cannot work')
      assert(results.textContent.indexOf('Facebook') > -1,
             'the title is still readable')
      assert(results.textContent.indexOf('Search Record Titles') > -1,
             'and the report says why')

      window.prefs.searchRecordTitles = true
      renderBreachResults(progress, results, outcome, 1)
      assert(results.querySelector('.x-breach-record-select'),
             'clickable again once the preference is back on')
      assert(results.textContent.indexOf('currently off') === -1,
             'and the note is gone')
    } finally {

      results.remove()
      window.prefs.searchRecordTitles = saved

async function runBreachTests14() {
  suite('breach.js — the entropy estimate knows about words')

  test('a passphrase is scored by words, not by length', () => {
    // The bug: length x log2(alphabet) scored std/creature/history at 118
    // bits. Three words from a 9,858-word list carry 40. The estimate was
    // wrong by threefold, in the unsafe direction, for exactly the passwords
    // PAM's own generator produces.
    const three = entropyBits('std/creature/history')
    assert(three >= 38 && three <= 42,
           `three words should score about 40 bits, got ${three}`)
    const five = entropyBits('vehicle/adverse/make/ours/craft')
    assert(five >= 64 && five <= 68,
           `five words should score about 66 bits, got ${five}`)
  })

  test('a random string is unaffected', () => {
    // The lower of the two estimates is taken, and for a cryptic password the
    // word estimate does not apply at all.
    assert(entropyBits('Zq7-Mvtl%Kdn#WroP2xj') > 100)
  })

  test('only dictionary words count', () => {
    // Guessing at concatenated words would understate a password that merely
    // contains one — a false REJECT teaches people to ignore the tool, which
    // costs more than the check saves.
    assert(entropyBits('xyzzy/plugh/frotz') > 60,
           'non-words fall back to the character estimate')
    assert(entropyBits('history') > 20,
           'a single word is not a passphrase')
  })

  test('the verdict follows', () => {
    const miss = {status: NOT_FOUND, count: 0, reason: ''}
    assertEqual(verdictFor('std/creature/history', miss).verdict, REJECT,
                'three words is below the floor and now says so')
    assertEqual(verdictFor('vehicle/adverse/make/ours/craft', miss).verdict, ACCEPT)
  })

  test('PAM no longer generates passwords its own checker rejects', () => {
    // The point of raising the generator defaults alongside the estimator fix.
    // Without it, correcting the measurement would have made PAM flag its own
    // output as weak.
    const saved = window.prefs
    window.prefs = getDefaultPrefs()
    try {
      const length = window.prefs.passwordRangeLengthDefault
      for (let i = 0; i < 20; i++) {
        const memorable = getMemorablePassword(length)
        assertEqual(structuralWeaknesses(memorable).length, 0,
                    `generated memorable password rejected: ${memorable} ` +
                    `(${structuralWeaknesses(memorable).join('; ')})`)
        const cryptic = getCrypticPassword(length, ALPHABET)
        assertEqual(structuralWeaknesses(cryptic).length, 0,
                    `generated cryptic password rejected: ${cryptic}`)
      }
    } finally {
      window.prefs = saved
    }
  })

  test('memorablePasswordMinWords is 5', () => {
    // Five words is 66 bits, which clears the 60-bit floor. Three is 40 and
    // does not.
    assertEqual(getDefaultPrefs().memorablePasswordMinWords, 5)
  })
}


async function runBreachTests15() {
  suite('prefs — one source of defaults')

  test('initPrefs() produces exactly getDefaultPrefs()', () => {
    // These were two hardcoded lists and they drifted. By v2.4.0 initPrefs()
    // was missing searchPasswordFieldValues (the v2.3.0 search oracle fix),
    // showPasswordReuseWarning and enablePasswordBreachCheck entirely — they
    // worked only because undefined is falsy — and still had the old password
    // length and word count after those were raised.
    //
    // The consequence was that every preference test asserted a value the
    // running application never read. initPrefs() now delegates, and this
    // check keeps it that way.
    const saved = window.prefs
    try {
      initPrefs()
      const running = window.prefs
      const expected = getDefaultPrefs()
      const keys = new Set(Object.keys(expected).concat(Object.keys(running)))
      const differences = []
      for (const key of keys) {
        // filePassCache is legitimately overridden per device from
        // localStorage (SEC-002), so it is the one key allowed to differ.
        if (key === 'filePassCache') { continue }
        if (JSON.stringify(expected[key]) !== JSON.stringify(running[key])) {
          differences.push(
            `${key}: model=${JSON.stringify(expected[key])} ` +
            `app=${JSON.stringify(running[key])}`)
        }
      }
      assertEqual(differences.length, 0,
                  'initPrefs() and getDefaultPrefs() disagree: ' +
                  differences.join('; '))
    } finally {
      window.prefs = saved
    }
  })
}

// ---------------------------------------------------------------------------
// vault.js — minimum-disclosure queries (fingerprint, reuse)
// ---------------------------------------------------------------------------
import {
  canonicalizeRecords, vaultFingerprint, secretFields, reuseGroups, reuseCount,
  partitionByActive, stripInactiveMarker
} from '/js/vault.js'

// Records in the shape convertInternalDataToJSON() produces. Plain literals —
// these functions never touch the DOM, so no accordion fixture is needed.
function mkrec(title, fields, active, created) {
  return {
    title: title,
    active: active === undefined ? true : active,
    created: created || '2026-01-01T00:00:00.000Z',
    fields: fields,
  }
}
function fld(name, type, value) {
  return {name: name, type: type, value: value}
}

const VAULT_A = [
  mkrec('github', [fld('username', 'text', 'joe'), fld('password', 'password', 'aaa')]),
  mkrec('gitlab', [fld('username', 'text', 'joe'), fld('password', 'password', 'bbb')]),
  mkrec('bank',   [fld('username', 'text', 'jl'),  fld('password', 'password', 'ccc')]),
]

suite('vault.js — canonicalizeRecords')
test('is stable under record reordering', () => {
  const shuffled = [VAULT_A[2], VAULT_A[0], VAULT_A[1]]
  assertEqual(canonicalizeRecords(shuffled), canonicalizeRecords(VAULT_A),
              'record order must not change the canonical form')
})
test('is stable under field reordering within a record', () => {
  const a = [mkrec('x', [fld('u', 'text', '1'), fld('p', 'password', '2')])]
  const b = [mkrec('x', [fld('p', 'password', '2'), fld('u', 'text', '1')])]
  assertEqual(canonicalizeRecords(a), canonicalizeRecords(b),
              'field order is presentation, not content')
})
test('ignores created, which is stamped with the current time on save', () => {
  const a = [mkrec('x', [fld('p', 'password', '1')], true, '2020-01-01T00:00:00.000Z')]
  const b = [mkrec('x', [fld('p', 'password', '1')], true, '2026-06-06T00:00:00.000Z')]
  assertEqual(canonicalizeRecords(a), canonicalizeRecords(b),
              'a differing created must not read as a differing vault')
})
test('distinguishes a changed value', () => {
  const b = [mkrec('x', [fld('p', 'password', '2')])]
  assertNotEqual(canonicalizeRecords([mkrec('x', [fld('p', 'password', '1')])]),
                 canonicalizeRecords(b))
})
test('distinguishes a changed title', () => {
  assertNotEqual(canonicalizeRecords([mkrec('x', [fld('p', 'password', '1')])]),
                 canonicalizeRecords([mkrec('y', [fld('p', 'password', '1')])]))
})
test('distinguishes a changed active flag', () => {
  assertNotEqual(canonicalizeRecords([mkrec('x', [fld('p', 'password', '1')], true)]),
                 canonicalizeRecords([mkrec('x', [fld('p', 'password', '1')], false)]))
})
test('distinguishes a changed field name', () => {
  assertNotEqual(canonicalizeRecords([mkrec('x', [fld('p', 'password', '1')])]),
                 canonicalizeRecords([mkrec('x', [fld('q', 'password', '1')])]))
})
test('distinguishes a changed field type', () => {
  assertNotEqual(canonicalizeRecords([mkrec('x', [fld('p', 'password', '1')])]),
                 canonicalizeRecords([mkrec('x', [fld('p', 'text', '1')])]))
})
test('no separator character lets one vault masquerade as another', () => {
  // Delimiter-agnostic on purpose. An earlier version of this test hardcoded
  // the separator the implementation happened to use, so it passed even when
  // the separator was changed to something forgeable — it was checking that
  // one specific character was absent, not that boundaries cannot be faked.
  // For each candidate separator, these two vaults differ but would collide
  // if the canonical form were a naive join on that character.
  const candidates = [':', '|', ',', '\t', '\n', '\u001f', '\u001e', '-', ' ', '/']
  for (const sep of candidates) {
    const a = [mkrec('x', [fld('p', 'password', 'u' + sep + 'v')])]
    const b = [mkrec('x', [fld('p', 'password' + sep + 'u', 'v')])]
    assertNotEqual(canonicalizeRecords(a), canonicalizeRecords(b),
                   'collision when separator is ' + JSON.stringify(sep))
  }
})
test('an empty vault canonicalizes without throwing', () => {
  assertEqual(canonicalizeRecords([]), '[]')
})
test('an empty vault differs from a populated one', () => {
  assertNotEqual(canonicalizeRecords([]), canonicalizeRecords(VAULT_A))
})
test('a record with no fields canonicalizes without throwing', () => {
  assert(canonicalizeRecords([mkrec('x', [])]).length > 0)
})

// ---------------------------------------------------------------------------
// vault.js — vaultFingerprint (async: crypto.subtle)
// ---------------------------------------------------------------------------
async function runVaultFingerprintTests() {
  suite('vault.js — vaultFingerprint')

  await runAsyncTest('is stable under record reordering', async () => {
    // The whole point of the feature. Two identical vaults serialised in
    // different orders must agree; an order-sensitive comparison reports a
    // difference that is not there.
    const shuffled = [VAULT_A[2], VAULT_A[0], VAULT_A[1]]
    assertEqual(await vaultFingerprint(shuffled), await vaultFingerprint(VAULT_A))
  })

  await runAsyncTest('is stable under field reordering', async () => {
    const a = [mkrec('x', [fld('u', 'text', '1'), fld('p', 'password', '2')])]
    const b = [mkrec('x', [fld('p', 'password', '2'), fld('u', 'text', '1')])]
    assertEqual(await vaultFingerprint(a), await vaultFingerprint(b))
  })

  await runAsyncTest('ignores created', async () => {
    const a = [mkrec('x', [fld('p', 'password', '1')], true, '2020-01-01T00:00:00.000Z')]
    const b = [mkrec('x', [fld('p', 'password', '1')], true, '2026-06-06T00:00:00.000Z')]
    assertEqual(await vaultFingerprint(a), await vaultFingerprint(b))
  })

  await runAsyncTest('changes when a password changes', async () => {
    const a = [mkrec('x', [fld('p', 'password', '1')])]
    const b = [mkrec('x', [fld('p', 'password', '2')])]
    assertNotEqual(await vaultFingerprint(a), await vaultFingerprint(b))
  })

  await runAsyncTest('changes when a record is added', async () => {
    const extra = VAULT_A.concat([mkrec('extra', [fld('p', 'password', 'z')])])
    assertNotEqual(await vaultFingerprint(VAULT_A), await vaultFingerprint(extra))
  })

  await runAsyncTest('changes when a record is removed', async () => {
    assertNotEqual(await vaultFingerprint(VAULT_A),
                   await vaultFingerprint(VAULT_A.slice(0, 2)))
  })

  await runAsyncTest('is deterministic across calls', async () => {
    assertEqual(await vaultFingerprint(VAULT_A), await vaultFingerprint(VAULT_A))
  })

  await runAsyncTest('formats as four groups of four hex characters', async () => {
    const fp = await vaultFingerprint(VAULT_A)
    assert(/^[0-9a-f]{4}( [0-9a-f]{4}){3}$/.test(fp), 'unexpected format: ' + fp)
  })

  await runAsyncTest('handles an empty vault', async () => {
    const fp = await vaultFingerprint([])
    assert(/^[0-9a-f]{4}( [0-9a-f]{4}){3}$/.test(fp), 'unexpected format: ' + fp)
  })

  await runAsyncTest('an empty vault differs from a populated one', async () => {
    assertNotEqual(await vaultFingerprint([]), await vaultFingerprint(VAULT_A))
  })

  // The reason the About dialogue publishes two fingerprints rather than one.
  //
  // Device A holds three active and two inactive records; device B holds the
  // same three active records and none of the inactive ones. A single
  // active-only fingerprint would report the two vaults as identical, and the
  // user would never learn that two records they deliberately kept — they
  // deactivated rather than deleted them — are missing from B.
  await runAsyncTest('a missing inactive record is detectable', async () => {
    const deviceA = [
      mkrec('a', [fld('p','password','1')], true),
      mkrec('b', [fld('p','password','2')], true),
      mkrec('old', [fld('p','password','x')], false),
    ]
    const deviceB = [
      mkrec('a', [fld('p','password','1')], true),
      mkrec('b', [fld('p','password','2')], true),
    ]
    const [aActive, aInactive] = partitionByActive(deviceA)
    const [bActive, bInactive] = partitionByActive(deviceB)

    assertEqual(await vaultFingerprint(aActive), await vaultFingerprint(bActive),
                'the live credentials really are in sync, and must say so')
    assertNotEqual(await vaultFingerprint(aInactive), await vaultFingerprint(bInactive),
                   'the archived difference must not be silently equal')
  })

  await runAsyncTest('active and inactive fingerprints are independent', async () => {
    // Changing an inactive record must not disturb the active fingerprint.
    const base = [mkrec('a', [fld('p','password','1')], true),
                  mkrec('old', [fld('p','password','x')], false)]
    const edited = [mkrec('a', [fld('p','password','1')], true),
                    mkrec('old', [fld('p','password','CHANGED')], false)]
    const [baseA, baseI] = partitionByActive(base)
    const [editA, editI] = partitionByActive(edited)
    assertEqual(await vaultFingerprint(baseA), await vaultFingerprint(editA))
    assertNotEqual(await vaultFingerprint(baseI), await vaultFingerprint(editI))
  })
}

import {
  getCurrentRecords, refreshVaultStats, updateReuseIndicator, menuReuseDlg,
  getCachedReuseCount, getCachedReuseGroups
} from '/js/vault-ui.js'

// A second accordion, swapped in for these tests only. convertInternalDataToJSON
// reads #records-accordion, so the id has to move rather than the element.
function mkVaultUiItem(title, active, fields) {
  const item = xmk('div').xClass('accordion-item')
  const btn = xmk('button').xClass('accordion-button')
  btn.innerHTML = title
  btn.setAttribute('x-active', active ? 'true' : 'false')
  btn.setAttribute('x-created', '2026-01-01T00:00:00.000Z')
  item.appendChild(btn)
  const body = xmk('div').xClass('accordion-body')
  fields.forEach(([name, type, value]) => {
    const row = xmk('div').xClass('row')
    const n = xmk('div').xClass('x-fld-name'); n.innerHTML = name
    const v = xmk('div').xClass('x-fld-value')
    v.setAttribute('data-fld-type', type)
    v.setAttribute('data-fld-raw-value', value)
    v.innerHTML = value
    row.appendChild(n); row.appendChild(v); body.appendChild(row)
  })
  item.appendChild(body)
  return item
}

function withVaultUiFixture(items, fn) {
  // Neutralise EVERY element carrying the id, not just the first.
  //
  // This used to take document.getElementById(), which returns one match. The
  // page has three elements that claim `records-accordion` at different
  // points, and if two were live at once the survivor sat earlier in document
  // order and won the lookup inside convertInternalDataToJSON() — so the
  // fixture's records were invisible and getCurrentRecords() returned []. The
  // symptom was a reuse report with nothing in it and no error anywhere,
  // because refreshVaultStats() swallows the failure.
  const displaced = Array.from(document.querySelectorAll('#records-accordion'))
  displaced.forEach(el => el.removeAttribute('id'))

  const fixture = xmk('div').xId('records-accordion')
  items.forEach(i => fixture.appendChild(i))
  document.body.appendChild(fixture)
  const badge = xmk('span').xId('x-reuse-indicator')
  badge.style.display = 'none'
  document.body.appendChild(badge)
  try {
    fn(badge)
  } finally {
    fixture.remove()
    badge.remove()
    displaced.forEach(el => el.setAttribute('id', 'records-accordion'))
  }
}

test('a deactivated record leaves the reuse report', () => {
  // Regression. The activate/deactivate toggle set x-active and called
  // searchRecords() to refresh the display, but never recomputed the vault
  // stats — every other refresh site fires on a change of record COUNT, which
  // deactivating is not. The cached groups therefore kept the record and the
  // report still listed it.
  const items = [
    mkVaultUiItem('live',    true, [['password','password','SHARED']]),
    mkVaultUiItem('retiring', true, [['password','password','SHARED']]),
  ]
  withVaultUiFixture(items, () => {
    window.prefs.hideInactiveRecords = true
    refreshVaultStats()
    assertEqual(getCachedReuseCount(), 2, 'both are active to begin with')

    // deactivate the second one the way the toggle does
    const buttons = document.querySelectorAll('#records-accordion .accordion-button')
    buttons[1].setAttribute('x-active', 'false')
    refreshVaultStats()

    assertEqual(getCachedReuseCount(), 0,
                'with one of the pair retired there is no reuse left to report')
    const dlg = menuReuseDlg()
    assert(dlg.textContent.indexOf('retiring') === -1,
           'the deactivated record must not appear in the report')
  })
})
test('reactivating puts it back', () => {
  const items = [
    mkVaultUiItem('live',    true,  [['password','password','SHARED']]),

finalize() // update summary with sync results so far
// Every async runner must be followed by finalize() before __TESTS_COMPLETE__
// is set, because finalize() is what writes window.__TEST_RESULTS__ — the
// object the Selenium runner reads to decide pass or fail.
//
// Calling it per-runner was fragile: it was called at the end of
// runCryptTests and runSaveRegressionTests but not the two after them, so
// runVaultFingerprintTests and runBreachTests rendered their results into the
// page while the TOTALS still reflected the state before they ran. Their
// failures would have shown as red lines on the page and passed the build.
// That was live for the whole of v2.3.0: the vaultFingerprint suite was
// running and reporting, but not gating.
//
// One finalize() at the end of the chain cannot drift the same way — adding a
// runner cannot leave it uncounted.
runCryptTests()
  .then(runSaveRegressionTests)
  .then(runVaultFingerprintTests)
  .then(runBreachTests)
  .then(finalize)
  .catch((err) => {
    // A throw in an async runner itself (not an individual test — those are
    // caught) would otherwise leave the flag false and strand the Selenium
    // runner until its timeout. Record it as a failure so it surfaces.
    _failed++
    const line = document.createElement('div')
    line.className = 'test-line fail'
    line.textContent = '✗ async test runner crashed'
    const pre = document.createElement('pre')
    pre.textContent = (err && err.message) || String(err)
    line.appendChild(pre)
    _results.appendChild(line)
    finalize()
  })
  .then(() => { window.__TESTS_COMPLETE__ = true })
